<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLiMa audio demo</title>
<style>
  body { font: 17px system-ui, sans-serif; max-width: 760px; margin: 48px auto; padding: 0 24px; color: #172b39; background: #f5f8fa; }
  h1 { margin-bottom: 8px; } p { line-height: 1.5; }
  button, input { font: inherit; padding: 12px; border-radius: 8px; border: 1px solid #b6c6d0; }
  button { cursor: pointer; background: #fff; } button:disabled { opacity: .5; cursor: default; }
  #record { background: #165b82; color: white; } input { flex: 1; min-width: 0; }
  .row { display: flex; gap: 12px; margin: 20px 0; } #status { min-height: 26px; }
  #answer { padding: 24px; background: white; border-radius: 12px; min-height: 70px; white-space: pre-wrap; }
  pre { white-space: pre-wrap; font-size: 13px; } audio { width: 100%; margin-top: 20px; }
</style>
<h1>LLiMa audio demo</h1>
<p>LFM2.5 Audio on Modalix · experimental<br>Record a short question, then listen to the reply. Each request starts a new conversation.</p>
<p id="limit">Connecting to model…</p>
<div class="row"><button id="record" disabled>Record question</button><button id="stop" disabled>Stop reply</button></div>
<form id="text-form" class="row"><input id="text" aria-label="Text prompt" placeholder="Or type a question" maxlength="1000"><button id="send" disabled>Send</button></form>
<p id="status" role="status">Loading…</p>
<div id="answer" aria-live="polite"></div>
<audio id="replay" controls hidden></audio>
<p><a id="download" hidden download="llima-reply.wav">Download reply</a></p>
<pre id="metrics"></pre>
<script type="module" src="/app.js"></script>
</html>

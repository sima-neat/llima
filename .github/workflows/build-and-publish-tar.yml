name: Build and Publish

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, neat]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME}"
            if [[ "${VERSION}" == v* ]]; then
              VERSION="${VERSION#v}"
            fi
            if [[ -z "${VERSION}" ]]; then
              echo "Tag '${GITHUB_REF_NAME}' resolved to an empty version" >&2
              exit 1
            fi
            LATEST_NAME=""
          else
            BRANCH_RAW="${GITHUB_REF_NAME}"
            BRANCH_SANITIZED="$(echo "${BRANCH_RAW}" | tr '[:upper:]' '[:lower:]' | sed -E 's#[^a-z0-9._-]+#-#g; s/^-+//; s/-+$//')"
            if [[ -z "${BRANCH_SANITIZED}" ]]; then
              BRANCH_SANITIZED="branch"
            fi
            SHORT_SHA="$(git rev-parse --short=12 "${GITHUB_SHA}")"
            VERSION="${BRANCH_SANITIZED}-${SHORT_SHA}"
            LATEST_NAME="sima-llima-${BRANCH_SANITIZED}-latest.tar.gz"
          fi

          ARCHIVE_NAME="sima-llima-${VERSION}.tar.gz"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive_name=${ARCHIVE_NAME}" >> "${GITHUB_OUTPUT}"
          echo "latest_name=${LATEST_NAME}" >> "${GITHUB_OUTPUT}"
          echo "Resolved archive name: ${ARCHIVE_NAME}"

      - name: Install host build dependencies
        shell: bash
        run: |
          ./build.sh --install-deps-only

      - name: Install NEAT internals into SDK sysroot
        shell: bash
        run: |
          ./scripts/release/install_neat_internals_dev.sh

      - name: Build Debian packages and distribution archive
        shell: bash
        env:
          ARCHIVE_NAME: ${{ steps.version.outputs.archive_name }}
          LATEST_NAME: ${{ steps.version.outputs.latest_name }}
        run: |
          ./build.sh --all --clean

      - name: Generate SHA256 files
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_NAME="${{ steps.version.outputs.archive_name }}"
          cat "dist/${ARCHIVE_NAME}.sha256"

          LATEST_NAME="${{ steps.version.outputs.latest_name }}"
          if [[ -n "${LATEST_NAME}" ]]; then
            cat "dist/${LATEST_NAME}.sha256"
          fi

      - name: Upload prepared artifacts for publish workflow
        uses: actions/upload-artifact@v6
        with:
          name: sima-llima-dist
          path: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: [build]
    uses: sima-neat/.github/.github/workflows/reusable-publish-download-artifacts.yml@main
    with:
      bucket: neat-artifacts
      environment_name: CloudFlare-R2
      artifact_root: llima
      project_name: sima-llima
      artifact_pattern: sima-llima-dist
      artifact_glob: dist/*.tar.gz*
      min_artifact_count: 2
      aws_region: auto
      upload_strategy: flat
      publish_index: true
      install_awscli: false
    secrets:
      aws_access_key_id: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      aws_secret_access_key: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      r2_account_id: ${{ secrets.CLOUDFLARE_R2_ACCOUNT_ID }}

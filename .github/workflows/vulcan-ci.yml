name: Vulcan CI

run-name: vulcan-ci (${{ vars.VULCAN_ENV || 'dev' }}, ${{ vars.VULCAN_SDK_CACHE || 'sdk-latest' }}, ${{ vars.VULCAN_CAPACITY || 'default' }})

on:
  push:
    branches:
      - "**"
    tags:
      - "*"
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read
  id-token: write
  packages: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type == 'branch' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  validate-vulcan-config:
    name: Validate Vulcan config
    runs-on: ubuntu-latest
    environment: ${{ vars.VULCAN_ENV || 'dev' }}
    env:
      VULCAN_ARTIFACT_BUCKET: ${{ vars.VULCAN_ARTIFACT_BUCKET }}
      VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN: ${{ vars.VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN }}
      VULCAN_ARTIFACT_KMS_KEY_ID: ${{ vars.VULCAN_ARTIFACT_KMS_KEY_ID }}
      VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID: ${{ vars.VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID }}
    steps:
      - name: Check required Vulcan variables
        shell: bash
        run: |
          set -euo pipefail

          missing=0
          for name in \
            VULCAN_ARTIFACT_BUCKET \
            VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN \
            VULCAN_ARTIFACT_KMS_KEY_ID \
            VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID
          do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required org or environment variable: ${name}" >&2
              missing=1
            else
              echo "Found ${name}"
            fi
          done

          if [[ "${missing}" -ne 0 ]]; then
            echo "Configure the missing variables at the sima-neat org level, visible to the public sima-neat/llima repository, or in the selected Vulcan environment." >&2
            exit 1
          fi

  build:
    name: Build LLiMa on Vulcan
    needs: validate-vulcan-config
    uses: sima-neat/.github/.github/workflows/vulcan-build.yml@main
    with:
      vulcan_env: ${{ vars.VULCAN_ENV || 'dev' }}
      sdk_cache: ${{ vars.VULCAN_SDK_CACHE || 'sdk-latest' }}
      capacity: ${{ vars.VULCAN_CAPACITY || 'default' }}
      fetch_depth: 0
      checkout_submodules: recursive
      ensure_sdk_container: true
      sdk_setup_args: "-y -n --minimal --workspace /mnt/vulcan/workspace --no-model-sdk --no-insight"
      artifact_name: sima-llima-dist
      artifact_path: dist/*
      artifact_retention_days: 3
      build_command: |
        set -euo pipefail

        sdk_container="$(docker ps --filter 'ancestor=ghcr.io/sima-neat/sdk:latest' --format '{{.Names}}' | head -n 1)"
        if [[ -z "${sdk_container}" ]]; then
          sdk_container="$(docker ps --filter 'name=sdk' --format '{{.Names}}' | head -n 1)"
        fi
        if [[ -z "${sdk_container}" ]]; then
          docker ps --format 'table {{.Names}}\t{{.Image}}\t{{.Status}}'
          echo "Could not find running SDK container." >&2
          exit 1
        fi

        docker exec \
          -e SIMA_CLI_CHECK_FOR_UPDATE=0 \
          -e GITHUB_HEAD_REF="${{ github.head_ref }}" \
          -e GITHUB_REF_NAME="${{ github.ref_name }}" \
          -e GITHUB_REF_TYPE="${{ github.ref_type }}" \
          -e GITHUB_SHA="${{ github.sha }}" \
          -e NEAT_VULCAN_ENV="${{ vars.VULCAN_ENV || 'dev' }}" \
          -e NEAT_INTERNALS_SOURCE="vulcan" \
          -e NEAT_INTERNALS_VULCAN_REPOSITORY="internals" \
          "${sdk_container}" \
          bash -lc '
            set -euo pipefail

            export SIMA_CLI_CHECK_FOR_UPDATE=0
            curl -fsSL https://artifacts.sima-neat.com/tools/sima-cli-install.py -o sima-cli-install.py
            python3 sima-cli-install.py main latest --noninteractive
            rm -f sima-cli-install.py
            export PATH="${HOME}/.sima-cli/.venv/bin:${PATH}"
            sima-cli version
            sima-cli vulcan install --help >/dev/null

            cd /workspace

            if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
              version="${GITHUB_REF_NAME}"
              version="${version#v}"
              latest_name=""
            else
              branch_raw="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}"
              branch_sanitized="$(printf "%s" "${branch_raw}" | tr "[:upper:]" "[:lower:]" | sed -E "s#[^a-z0-9._-]+#-#g; s/^-+//; s/-+$//")"
              if [[ -z "${branch_sanitized}" ]]; then
                branch_sanitized="branch"
              fi
              short_sha="$(printf "%s" "${GITHUB_SHA}" | cut -c1-12)"
              version="${branch_sanitized}-${short_sha}"
              latest_name="sima-llima-${branch_sanitized}-latest.tar.gz"
            fi

            export ARCHIVE_NAME="sima-llima-${version}.tar.gz"
            export LATEST_NAME="${latest_name}"
            echo "Resolved archive name: ${ARCHIVE_NAME}"
            if [[ -n "${LATEST_NAME}" ]]; then
              echo "Resolved latest archive name: ${LATEST_NAME}"
            fi

            ./build.sh --install-deps-only
            ./build.sh --all --clean
          '

      post_build_command: |
        set -euo pipefail

        mapfile -t ARCHIVES < <(find dist -maxdepth 1 -type f -name 'sima-llima-*.tar.gz' | sort)
        mapfile -t SHA_FILES < <(find dist -maxdepth 1 -type f -name 'sima-llima-*.tar.gz.sha256' | sort)

        if [[ "${#ARCHIVES[@]}" -lt 1 || "${#SHA_FILES[@]}" -lt 1 ]]; then
          echo "Expected at least one LLiMa dist archive and sha256 file." >&2
          echo "archives: ${#ARCHIVES[@]}" >&2
          printf '  %s\n' "${ARCHIVES[@]}" >&2 || true
          echo "sha256 files: ${#SHA_FILES[@]}" >&2
          printf '  %s\n' "${SHA_FILES[@]}" >&2 || true
          exit 1
        fi

        primary_archive=""
        for archive in "${ARCHIVES[@]}"; do
          if [[ "${archive}" != *-latest.tar.gz ]]; then
            primary_archive="${archive}"
            break
          fi
        done
        if [[ -z "${primary_archive}" ]]; then
          primary_archive="${ARCHIVES[0]}"
        fi

        test -f "${primary_archive}.sha256"
        sha256sum -c <(awk -v file="$(basename "${primary_archive}")" '{print $1 "  dist/" file}' "${primary_archive}.sha256")
        llima_version="$(
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("deps/manifest.json").read_text())
          print(manifest.get("platform-version", "").strip())
          PY
        )"
        if [[ -z "${llima_version}" ]]; then
          echo "deps/manifest.json must define platform-version." >&2
          exit 1
        fi
        tar -tzf "${primary_archive}" "sima-lmm-${llima_version}-Linux-core.deb" >/dev/null
        tar -tzf "${primary_archive}" "sima-lmm-${llima_version}-Linux-dev.deb" >/dev/null
        tar -tzf "${primary_archive}" "sima-lmm-${llima_version}-Linux-cli.deb" >/dev/null
        ls -lh dist

  publish-vulcan-artifacts:
    name: Publish to Vulcan
    needs: build
    uses: sima-neat/.github/.github/workflows/vulcan-publish-artifacts.yml@main
    with:
      aws_region: ${{ vars.VULCAN_AWS_REGION || 'us-west-2' }}
      environment_name: ${{ vars.VULCAN_ENV || 'dev' }}
      bucket: ${{ vars.VULCAN_ARTIFACT_BUCKET }}
      role_to_assume: ${{ vars.VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN }}
      sse_kms_key_id: ${{ vars.VULCAN_ARTIFACT_KMS_KEY_ID }}
      cloudfront_distribution_id: ${{ vars.VULCAN_ARTIFACT_CLOUDFRONT_DISTRIBUTION_ID }}
      artifact_folder: "."
      artifact_pattern: sima-llima-dist
      artifact_glob: "*"
      min_artifact_count: 2

  promote-latest-tag:
    name: Promote Vulcan latest tag
    if: ${{ github.ref_type == 'branch' }}
    needs: publish-vulcan-artifacts
    uses: sima-neat/.github/.github/workflows/vulcan-update-latest-artifacts.yml@main
    with:
      aws_region: ${{ vars.VULCAN_AWS_REGION || 'us-west-2' }}
      environment_name: ${{ vars.VULCAN_ENV || 'dev' }}
      bucket: ${{ vars.VULCAN_ARTIFACT_BUCKET }}
      role_to_assume: ${{ vars.VULCAN_ARTIFACT_PUBLISHER_ROLE_ARN }}
      sse_kms_key_id: ${{ vars.VULCAN_ARTIFACT_KMS_KEY_ID }}
      artifact_folder: "."

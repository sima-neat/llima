[pytest]
addopts = "-m premerge"
testpaths = .
markers   =
  premerge: marks tests as tests to run on PR (deselect with '-m "not not premerge"')
  compiler_unit: fast hermetic compiler tests that require no external model data
  compiler_config: cached-model configuration contract regression tests
  compiler_source: cached source-model parser, mapping, and dequantization tests
  compiler_onnx_regression: same-run base-versus-candidate ONNX regression tests
  compiler_graph_integration: generated SDK graph and quantization integration tests
  compiler_e2e: selected-model full Model Compiler end-to-end tests
  postmerge: marks tests as tests to run postmerge (deselect with '-m "not postmerge"')
  nightly: marks tests as tests to run nightly (deselect with '-m "not nightly"')
  weekly: marks tests as tests to run nightly (deselect with '-m "not weekly"')
  serial: marks tests that should run after the parallel premerge batch
  high_memory: marks tests that require constrained high-memory scheduling

[flake8]
max-line-length = 120

[tox]
envlist = premerge
pytest_display_ops = -vv --color=yes
pytest_report_ops = --junitxml=junit-{envname}.xml
pytest_serial_report_ops = --junitxml=junit-{envname}-serial.xml
pytest_coverage_ops = --cov-report xml --cov=sima_lmm
pytest_tempdir_ops = --basetemp={envtmpdir}
pytest_xdist_ops = -n 4 --dist worksteal
pytest_ops = {[tox]pytest_display_ops} {[tox]pytest_report_ops} {[tox]pytest_coverage_ops} {[tox]pytest_tempdir_ops} {[tox]pytest_xdist_ops}

[testenv:premerge]
passenv =
    GITHUB_SHA
    LLIMA_HF_MODELS_PATH
    LLIMA_BASE_ONNX_ROOT
    LLIMA_BASE_ONNX_MANIFEST
    LLIMA_CANDIDATE_ONNX_ROOT
    LLIMA_CANDIDATE_ONNX_MANIFEST
    LLIMA_E2E_REPORT
    LLIMA_MODEL_INPUT_PROVENANCE
extras = tests,sdk
install_command = pip install --use-deprecated=legacy-resolver {packages}
commands =
    pytest {[tox]pytest_display_ops} {[tox]pytest_report_ops} {[tox]pytest_coverage_ops} {[tox]pytest_tempdir_ops} {[tox]pytest_xdist_ops} -m "{envname} and not serial" {posargs}
    pytest {[tox]pytest_display_ops} {[tox]pytest_serial_report_ops} {[tox]pytest_tempdir_ops} -m "{envname} and serial" {posargs}

[testenv:compiler-unit]
extras = tests,sdk
install_command = pip install --use-deprecated=legacy-resolver {packages}
commands =
    pytest -vv --color=yes --strict-markers -ra \
        --junitxml=junit-compiler-unit.xml \
        --cov-report=xml:coverage-compiler-unit.xml \
        --cov=sima_lmm \
        --basetemp={envtmpdir} \
        -m compiler_unit \
        tests/compilation/unit \
        {posargs}


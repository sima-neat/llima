version: 1  # Unused, must be set to 1.
formatters:
  simple:
    format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
handlers:
  console:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stderr
  console_noformat:
    class: logging.StreamHandler
    level: INFO
    stream: ext://sys.stderr
  file:
    class: logging.FileHandler
    level: INFO
    formatter: simple
    filename: run.log
    mode: w
loggers:
# Example how to configure logger that will not propagate messages to its parent logger.
  tests:
    level: INFO
    handlers: [console_noformat]
    propagate: no
root:
  level: DEBUG
  handlers: [file]
disable_existing_loggers: False

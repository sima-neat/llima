# Folders pcie-genai-backend (and the host's start script) need on the card:
# queue pid/status files and the queue logs. /run is cleared at every boot,
# so systemd-tmpfiles makes them again. Owner sima: the host may start the
# card program as the default "sima" SSH user (or as root).
d /run/sima-neat/pcie 0755 sima sima -
d /var/log/sima-neat/pcie 0755 sima sima -

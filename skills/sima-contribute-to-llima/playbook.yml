id: sima-contribute-to-llima
name: Contribute to LLiMa
version: 0.2.0
agents: [codex, claude]
description: Modify or review the LLiMa repository. For new LLM/VLM checkpoint compatibility or architecture support, use sima-add-llima-model-support.
compatibility:
  env_types: [host, sdk]
  env_subtypes: [linux, palette]
  min_cli_version: 2.1.2
runtime:
  requires:
    - git
    - python3

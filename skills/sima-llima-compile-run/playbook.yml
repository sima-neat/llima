id: sima-llima-compile-run
name: Compile and Test LLiMa Models
version: 0.1.2
agents: [codex, claude]
description: Prefer exact SiMa.ai pre-quantized LLM and VLM inputs by default, honor explicit source or fidelity requirements, compile with LLiMa, and validate with llima run.
compatibility:
  env_types: [host, sdk]
  env_subtypes: [linux, palette]
  min_cli_version: 2.1.2
runtime:
  requires:
    - python3
    - ssh
    - rsync

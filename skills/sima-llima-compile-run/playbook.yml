id: sima-llima-compile-run
name: Compile and Test LLiMa Models
version: 0.2.0
agents: [codex, claude]
description: Compile supported LLMs/VLMs with LLiMa and deploy or validate them on Modalix. Excludes repository maintenance and ordinary ONNX models.
compatibility:
  env_types: [host, sdk]
  env_subtypes: [linux, palette]
  min_cli_version: 2.1.2
runtime:
  requires:
    - python3
    - ssh
    - rsync
